<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Dresses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>Manage Dresses</h1>
      <a href="index.html" class="btn">Back to Billing</a>
    </div>

    <section id="formBox" hidden>
      <h2 id="formTitle">Add Dress</h2>
      <label>Dress name
        <input type="text" id="dName" placeholder="e.g. Kurta, School Uniform" maxlength="40">
      </label>
      <label class="gap">Default rate (optional)
        <input type="number" id="dRate" min="0" step="0.01" inputmode="decimal" placeholder="Leave empty if not fixed">
      </label>

      <div class="label-line gap">Measurements</div>
      <div id="chips" class="chips"></div>
      <div class="add-row">
        <input type="text" id="mName" placeholder="Measurement name, e.g. Neck" maxlength="30">
        <button type="button" id="mAddBtn">Add</button>
      </div>

      <p id="formError" class="error" role="alert"></p>
      <div class="form-actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="button" id="saveBtn" class="primary">Save Dress</button>
      </div>
    </section>

    <section>
      <div class="list-head">
        <h2>Dress list</h2>
        <button type="button" id="addBtn" class="primary">Add Dress</button>
      </div>
      <div id="dressList"></div>
      <p id="listMsg" class="ok-msg" role="status"></p>
    </section>

    <section>
      <button type="button" id="resetBtn">Reset to default list</button>
    </section>
  </div>
  <script src="store.js"></script>
  <script src="dresses.js"></script>
</body>
</html>
